openapi: 3.0.3
info:
  title: Knowledge artifact
  version: 0.1.0
  description: >
    Contract of the knowledge artifact. Written before the code (contract
    first); the scripts service implements it. It has no HTTP endpoint; its
    commands are under x-commands. Each command reads the knowledge folder and
    changes nothing.
servers:
  - url: http://localhost
    description: No server; the commands run on the machine of the caller.
paths: {}
x-commands:
  checkDocs:
    caller: A person or CI, at the root of a workspace or in any folder under it.
    description: >
      python3 scripts/check_docs.py. Checks links, anchors, knowledge IDs,
      citation direction, the artifacts a flow crosses, and scenarios and
      their operations. Validates explicitly declared local and shared
      Flow rules and their citations while preserving existing artifact ID
      forms.
    input:
      $ref: '#/components/schemas/CheckDocsInput'
    output:
      $ref: '../../system/openapi.yaml#/components/schemas/CheckOutput'
  traceImpact:
    caller: A person or a coding agent, before a change, in any folder of a workspace.
    description: >
      python3 scripts/impact.py <name>. Lists what a change to the units the
      name stands for affects.
    input:
      $ref: '#/components/schemas/TraceInput'
    output:
      $ref: '#/components/schemas/TraceOutput'
  traceDown:
    caller: A person or a coding agent, before building, in any folder of a workspace.
    description: >
      python3 scripts/impact.py --down <name>. Lists what the units the name
      stands for rely on.
    input:
      $ref: '#/components/schemas/TraceInput'
    output:
      $ref: '#/components/schemas/TraceOutput'
  countImpact:
    caller: A person, in any folder of a workspace.
    description: >
      python3 scripts/impact.py --stats [name]. Counts the size of each goal
      and the blast radius of each requirement, rule and operation, or both
      counts for one name.
    input:
      $ref: '#/components/schemas/CountInput'
    output:
      $ref: '#/components/schemas/CountOutput'
  listQuestions:
    caller: A person, before a goal is built, in any folder of a workspace.
    description: >
      python3 scripts/impact.py --questions. Lists, for each goal, the open
      questions that hold it.
    input:
      $ref: '#/components/schemas/ListQuestionsInput'
    output:
      $ref: '#/components/schemas/ListQuestionsOutput'
components:
  schemas:
    CheckDocsInput:
      type: object
      description: The command takes no argument. It reads the configuration at the root.
    TraceInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            The only argument besides the option: a knowledge ID, a prefix, an
            operation, a page path in the knowledge folder or a schema
            property.
          example: checkDocs
    TraceOutput:
      type: object
      required: [exit_status, stdout, stderr]
      properties:
        exit_status:
          type: integer
          enum: [0, 1, 2]
          description: 0 when the name stands for a unit, 1 when it stands for nothing or knowledge contains Withdrawn rows, 2 when the command is not given exactly one name.
        stdout:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: >
            One line for each kind that has units, in this order - Requirements,
            Goal criteria, Flow scenarios, Flow rules, Artifact rules,
            Operations, Contract schemas - each followed by its
            units in sorted order; then one line of Pages. Flow rules are
            classified by their declaration, not by ID spelling.
          example: ['Operations: checkDocs', 'Pages: artifacts/knowledge/openapi.yaml']
        stderr:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: When the name stands for nothing, one line that says so; on a usage error, the usage. Each Withdrawn row produces an error naming its page and ID, with no report on stdout.
    CountInput:
      type: object
      properties:
        name:
          type: string
          description: The only argument besides the option. A goal key, a knowledge ID or an operation. Without it, every goal and every requirement, rule and operation is counted.
          example: G-GATE
    CountOutput:
      type: object
      required: [exit_status, stdout, stderr]
      properties:
        exit_status:
          type: integer
          enum: [0, 1]
          description: 0 when counted, 1 when the name stands for nothing or knowledge contains Withdrawn rows.
        stdout:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: >
            Without a name, the size of each goal, then the blast radius of
            each requirement, rule and operation, the most scenarios first,
            then the most operations. With a name, one line of what it
            relies on and one line of what a change to it affects. The rules
            count includes both artifact rules and Flow rules under the same
            label.
        stderr:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: When the name stands for nothing, one line that says so. Each Withdrawn row produces an error naming its page and ID, with no report on stdout.
    ListQuestionsInput:
      type: object
      description: The command takes no argument besides the option.
    ListQuestionsOutput:
      type: object
      required: [exit_status, stdout, stderr]
      properties:
        exit_status:
          type: integer
          enum: [0, 1]
          description: 0 when listed, 1 when knowledge contains Withdrawn rows.
        stdout:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: >
            For each goal, the number of open questions that hold it, then
            each one with its page. Then the open questions that name
            nothing in the knowledge.
        stderr:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: Each Withdrawn row produces an error naming its page and ID, with no report on stdout.
