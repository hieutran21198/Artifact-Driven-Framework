openapi: 3.0.3
info:
  title: Introduction artifact
  version: 0.1.0
  description: >
    Contract of the introduction artifact. Written before the code (contract
    first); the landing service implements it. It has no HTTP endpoint; the
    actions of a reader on the page are under x-commands.
servers:
  - url: http://localhost
    description: No server; the page runs in the browser of the reader.
paths: {}
x-commands:
  playStory:
    caller: The page when it opens, or a reader who presses play or pause.
    description: >
      Starts the story from the step it shows, or stops it when it plays
      (INTRO-1, INTRO-5).
    input:
      $ref: '#/components/schemas/PlayStoryInput'
    output:
      $ref: '#/components/schemas/StoryState'
  showStep:
    caller: A reader who picks a step, or the next or the previous one.
    description: Stops the story and shows the step picked (INTRO-1, INTRO-5).
    input:
      $ref: '#/components/schemas/ShowStepInput'
    output:
      $ref: '#/components/schemas/StoryState'
  explainBlock:
    caller: A reader who points at a block of the story, or taps it.
    description: Shows what the block is in the sample, in plain words (INTRO-9).
    input:
      $ref: '#/components/schemas/ExplainBlockInput'
    output:
      $ref: '#/components/schemas/ExplainBlockOutput'
  openFramework:
    caller: A reader who follows the link to the framework page.
    description: Opens the framework page, the technical guide (INTRO-13).
    input:
      type: object
    output:
      type: object
  copyInstall:
    caller: A reader who presses the copy button next to the install command.
    description: Puts the install command on the clipboard of the reader.
    input:
      type: object
    output:
      $ref: '#/components/schemas/CopyInstallOutput'
  openMethod:
    caller: A reader who follows the link to the how-we-work page.
    description: Opens the page that shows how a requirement is broken down and who does what (INTRO-15).
    input:
      type: object
    output:
      type: object
  openTracker:
    caller: A reader who follows the link to the project tracker.
    description: Opens the project tracker (INTRO-15).
    input:
      type: object
    output:
      $ref: '#/components/schemas/OpenTrackerOutput'
components:
  schemas:
    Step:
      type: string
      enum: [goal, flow, rule, artifact, client, scan, change]
      description: A step of the story, in the order of INTRO-1.
    PlayStoryInput:
      type: object
      properties:
        reduced_motion:
          type: boolean
          description: True when the system of the reader asks for reduced motion. Then the story does not play (INTRO-5).
          default: false
    ShowStepInput:
      type: object
      required: [step]
      properties:
        step:
          $ref: '#/components/schemas/Step'
    StoryState:
      type: object
      required: [step, playing]
      properties:
        step:
          $ref: '#/components/schemas/Step'
        playing:
          type: boolean
          description: True while the story goes from step to step by itself (INTRO-5).
    ExplainBlockInput:
      type: object
      required: [block]
      properties:
        block:
          type: string
          description: The block of the story the reader points at, such as the goal, a flow, a rule, a group or an app.
          example: Borrowing
    ExplainBlockOutput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: What the block is in the sample, in plain words. On the scan step, a rule also says whether the scan found it (INTRO-9).
          example: A borrowed book is due back 14 days later.
    CopyInstallOutput:
      type: object
      required: [clipboard]
      properties:
        clipboard:
          type: string
          description: The command that creates a workspace from main, as the installWorkspace command takes it.
          example: curl -fsSL https://raw.githubusercontent.com/hieutran21198/Artifact-Driven-Framework/main/install.sh | sh -s -- my-workspace
    OpenTrackerOutput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The address of the project tracker, relative to the page. It names no workspace, so the tracker opens the repository of the framework (TRK-1).
          example: tracker/
