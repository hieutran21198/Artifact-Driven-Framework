openapi: 3.0.3
info:
  title: Introduction artifact
  version: 0.1.0
  description: >
    Contract of the introduction artifact. Written before the code (contract
    first); the landing service implements it. It has no HTTP endpoint; the
    actions of a reader on the page are under x-commands. These actions
    describe the static reading interface, not installed workspace commands.
servers:
  - url: http://localhost
    description: No server; the page runs in the browser of the reader.
paths: {}
x-commands:
  openTopic:
    caller: A reader who follows a topic link or opens its fragment URL.
    description: >
      Opens a topic on the canonical reading page through a native fragment
      link (SYS-8, INTRO-10).
    input:
      $ref: '#/components/schemas/OpenTopicInput'
    output:
      type: object
  openFramework:
    caller: A reader who opens the former framework page URL.
    description: >
      Forwards framework.html to the canonical reading page. A known fragment
      opens its matching topic or reference; no fragment or an unknown fragment opens
      index.html#files (SYS-8).
    input:
      type: object
    output:
      type: object
  copyInstall:
    caller: A reader who presses the copy button next to the install command.
    description: Puts the install command on the clipboard of the reader.
    input:
      type: object
    output:
      $ref: '#/components/schemas/CopyInstallOutput'
  openMethod:
    caller: A reader who opens the former how-we-work page URL.
    description: >
      Forwards how-we-work.html to the canonical reading page. A known fragment
      opens its matching topic or reference; no fragment or an unknown fragment opens
      index.html#knowledge (SYS-8).
    input:
      type: object
    output:
      type: object
  openAgents:
    caller: A reader who opens the former agents page URL.
    description: >
      Forwards agents.html to the canonical reading page. A known fragment
      opens its matching topic or reference; no fragment or an unknown fragment opens
      index.html#change (SYS-8).
    input:
      type: object
    output:
      type: object
  openTracker:
    caller: A reader who follows the link to the project tracker.
    description: Opens the project tracker (SYS-8).
    input:
      type: object
    output:
      $ref: '#/components/schemas/OpenTrackerOutput'
components:
  schemas:
    OpenTopicInput:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          enum: [overview, knowledge, change, checks, install]
          description: The topic fragment on index.html (SYS-8, INTRO-10).
    CopyInstallOutput:
      type: object
      required: [clipboard]
      properties:
        clipboard:
          type: string
          description: The command that creates a workspace from main, as the installWorkspace command takes it.
          example: curl -fsSL https://raw.githubusercontent.com/hieutran21198/Artifact-Driven-Framework/main/install.sh | sh -s -- my-workspace
    OpenTrackerOutput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The address of the project tracker, relative to the page. It names no workspace, so the tracker opens the repository of the framework (TRK-1).
          example: tracker/
