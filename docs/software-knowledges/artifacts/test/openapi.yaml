openapi: 3.0.3
info:
  title: Test artifact
  version: 0.1.0
  description: >
    Contract of the test artifact. Written before the code (contract first);
    the scripts service implements it. It has no HTTP endpoint; its commands
    are under x-commands. Each command reads the test files and the knowledge
    and changes nothing.
servers:
  - url: http://localhost
    description: No server; the commands run on the machine of the caller.
paths: {}
x-commands:
  checkTests:
    caller: A person or CI, on the checkout of a code change.
    description: >
      python3 scripts/check_tests.py [folder]. Checks that test files name
      only knowledge IDs that exist and are not withdrawn when their complete
      prefix occurs in the knowledge. An unknown complete prefix is ignored,
      including an unknown Flow-rule scope.
    input:
      $ref: '#/components/schemas/CheckTestsInput'
    output:
      $ref: '../../system/openapi.yaml#/components/schemas/CheckOutput'
  measureCoverage:
    caller: A person, in any folder of a workspace.
    description: >
      python3 scripts/impact.py --coverage [folder]. Prints, for each goal,
      the share of its criteria, scenarios and rules that test files name, and
      the ones no test file names.
    input:
      $ref: '#/components/schemas/TestsFolderInput'
    output:
      $ref: '#/components/schemas/MeasureCoverageOutput'
  rankFragile:
    caller: A person, in any folder of a workspace.
    description: >
      python3 scripts/impact.py --fragile [folder]. Prints the 20 most fragile
      requirements, rules, operations and schemas.
    input:
      $ref: '#/components/schemas/TestsFolderInput'
    output:
      $ref: '#/components/schemas/RankFragileOutput'
components:
  schemas:
    CheckTestsInput:
      type: object
      properties:
        folder:
          type: string
          description: >
            The only argument, relative to the root. The tests folder to read
            instead of the tests of every part. When it is the folder of a
            part, the glob of that part applies.
          example: services/lending
    TestsFolderInput:
      type: object
      properties:
        folder:
          type: string
          description: >
            The only argument besides the option, relative to the root. The
            tests folder to read instead of the tests of every part. The
            tests folder of each part that is that folder or under it is read
            with that part's glob; a folder with no part's tests folder, with
            the default glob.
          example: tests/scripts
    MeasureCoverageOutput:
      type: object
      required: [exit_status, stdout, stderr]
      properties:
        exit_status:
          type: integer
          enum: [0, 1]
          description: 0 when measured, 1 when the folder does not exist, there are no test files to read, or knowledge contains a withdrawn tombstone.
        stdout:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: >
            One line for each goal - its key, the tested share as a percent,
            and criteria, scenarios and rules as tested out of all - followed
            by a line of the IDs no test file names, in the order of their
            numbers. Then one line for the whole knowledge, and one for the
            system requirements with the ones no test file names. The rules totals include both artifact
            rules and Flow rules under the same label.
          example: ['  G-GATE        60%  criteria 1/2  scenarios 2/4  rules 3/4']
        stderr:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: Why nothing was measured.
    RankFragileOutput:
      type: object
      required: [exit_status, stdout, stderr]
      properties:
        exit_status:
          type: integer
          enum: [0, 1]
          description: 0 when ranked, 1 when the folder given does not exist or knowledge contains a withdrawn tombstone.
        stdout:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: >
            How the score is made, then one line for each of the 20 most
            fragile units - rank, score, name, scenarios, operations, the
            scenarios that cite it, the test files that name it or
            - when no test files are read, and whether an open question names
            it.
        stderr:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: Why nothing was ranked.
