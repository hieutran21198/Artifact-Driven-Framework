openapi: 3.0.3
info:
  title: Repository artifact
  version: 0.1.0
  description: >
    Contract of the repository artifact. Written before the code (contract
    first); the scripts service implements it. It has no HTTP endpoint; its
    command is under x-commands.
servers:
  - url: http://localhost
    description: No server; the command runs on the machine of the caller.
paths: {}
x-commands:
  checkStructure:
    caller: A person or CI, at the root of a workspace or in any folder under it (SYS-2).
    description: >
      python3 scripts/check_structure.py. Finds each folder that counts and
      has no README (REPO-1).
    input:
      $ref: '#/components/schemas/CheckStructureInput'
    output:
      $ref: '#/components/schemas/CheckStructureOutput'
components:
  schemas:
    CheckStructureInput:
      type: object
      description: The command takes no argument. It reads the file list of Git at the root (REPO-1).
    CheckStructureOutput:
      type: object
      required: [exit_status, stdout, stderr]
      properties:
        exit_status:
          type: integer
          enum: [0, 1, 2]
          description: 0 when every folder has a README, 1 when one has none, 2 when Git cannot give the file list (REPO-1, SYS-3).
        stdout:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: On success, one line with the number of folders checked.
        stderr:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Problems'
          description: One line for each README that is missing, by its path; or one line that says Git cannot give the file list.
