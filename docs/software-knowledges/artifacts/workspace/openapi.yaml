openapi: 3.0.3
info:
  title: Workspace artifact
  version: 0.1.0
  description: >
    Contract of the workspace artifact. Written before the code (contract
    first); the install service implements it. It has no HTTP endpoint; its
    command is under x-commands.
servers:
  - url: http://localhost
    description: No server; the command runs on the machine of the caller.
paths: {}
x-commands:
  installWorkspace:
    caller: A person who starts a project, in a shell.
    description: >
      sh install.sh <folder> [ref], or the same script piped from curl.
      Creates a workspace in a new folder (WS-1 to WS-8).
    input:
      $ref: '#/components/schemas/InstallWorkspaceInput'
    output:
      $ref: '#/components/schemas/InstallWorkspaceOutput'
components:
  schemas:
    InstallWorkspaceInput:
      type: object
      required: [folder]
      properties:
        folder:
          type: string
          description: The first argument. The folder to create; it must not exist (WS-1).
          example: my-project
        ref:
          type: string
          description: The second argument. The branch, tag or commit of the framework to install (WS-2).
          default: main
          example: v1.0.0
        ad_source:
          type: string
          description: The environment variable AD_SOURCE. A local copy of the framework to copy from instead of downloading (WS-2).
          example: /tmp/artifact-driven
    InstallWorkspaceOutput:
      type: object
      required: [exit_status, stdout, stderr]
      properties:
        exit_status:
          type: integer
          description: 0 when the workspace is created; any other status when nothing was created (WS-1, WS-6).
          example: 0
        stdout:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: On success, the folder created and the next steps, in order - enter the folder, make it a Git repository and run the structure and docs checks (WS-8).
        stderr:
          allOf:
            - $ref: '../../system/openapi.yaml#/components/schemas/Lines'
          description: On failure, why nothing was created, such as a folder that exists (WS-1).
