openapi: 3.0.3
info:
  title: Tracker artifact
  version: 0.1.0
  description: >
    Contract of the tracker artifact. Written before the code (contract
    first); the tracker service implements it. It has no HTTP endpoint; the
    actions of a reader on the page are under x-commands.
servers:
  - url: http://localhost
    description: No server; the page runs in the browser of the reader.
paths: {}
x-commands:
  openWorkspace:
    caller: The page when it opens with a workspace in its address, or a reader who presses Load.
    description: >
      Captures the load's inputs before asynchronous reads, resolves each
      repository ref, and reads the files selected by the effective
      configuration. Shows the build with its
      provenance and each part's read outcome.
      Reuses a build only with matching repositories, full resolved commits,
      effective configuration and analyzer identity, and no failed or
      unresolved required source read. Confirmed missing tests do not
      prevent reuse. Requested refs, configuration source and read outcomes
      remain those of the current load; a later load retries failed reads.
      A superseded load cannot replace a newer result or its status, warnings
      or controls. A failed configuration or knowledge read shows no
      new build. The site treats workspace content as data and runs sandboxed.
    input:
      $ref: '#/components/schemas/OpenWorkspaceInput'
    output:
      $ref: '#/components/schemas/Build'
  listRefs:
    caller: A reader who opens the ref field of a repository or of a part.
    description: >
      Lists the branches and tags of the repository, the default branch first. A response applies only to the workspace, part, source,
      configuration and token selection that requested it.
    input:
      $ref: '#/components/schemas/ListRefsInput'
    output:
      $ref: '#/components/schemas/ListRefsOutput'
  setToken:
    caller: A reader who sets or removes a token in the settings.
    description: Keeps a read-only token under a name until the tab closes, or removes it.
    input:
      $ref: '#/components/schemas/SetTokenInput'
    output:
      type: object
  addWorkspace:
    caller: A reader who adds a repository in the settings.
    description: Adds the repository with its branch and the token picked, or none, and checks it.
    input:
      $ref: '#/components/schemas/AddWorkspaceInput'
    output:
      $ref: '#/components/schemas/CheckSettingsOutput'
  removeWorkspace:
    caller: A reader who removes a workspace in the settings.
    description: Removes the workspace from the settings and the workspace picker.
    input:
      type: object
      required: [workspace]
      properties:
        workspace:
          type: string
          example: hieutran21198/Artifact-Driven-Framework
    output:
      type: object
  checkSettings:
    caller: The page the first time the settings open in a page load, for what it has not checked yet, or a reader who asks to check again.
    description: Checks each workspace, each part its configuration names and each token, with one call to GitHub for each repository and each token.
    input:
      type: object
    output:
      $ref: '#/components/schemas/CheckSettingsOutput'
  changeConfiguration:
    caller: A reader who edits the configuration of a workspace in the settings.
    description: Validates the configuration given and, when it is valid, keeps it for the workspace in this browser and uses it in place of the workspace's.
    input:
      $ref: '#/components/schemas/ChangeConfigurationInput'
    output:
      $ref: '#/components/schemas/ChangeConfigurationOutput'
  restoreConfiguration:
    caller: A reader who goes back to the configuration of the workspace.
    description: Drops the configuration changed in this browser for the workspace.
    input:
      type: object
      required: [workspace]
      properties:
        workspace:
          type: string
    output:
      type: object
  copyCloneScript:
    caller: A reader who copies the clone script of a workspace in the settings.
    description: Puts on the clipboard a shell script that clones the workspace and the repository of each part at the refs picked.
    input:
      type: object
      required: [workspace]
      properties:
        workspace:
          type: string
          example: hieutran21198/Artifact-Driven-Framework
    output:
      $ref: '#/components/schemas/CloneScriptOutput'
  addFolder:
    caller: A reader who adds a folder on their computer as a workspace.
    description: >
      Adds the folder to the workspaces and opens it. The build has
      the load's read outcomes and working-copy provenance, not an atomic
      disk or Git snapshot.
    input:
      type: object
    output:
      $ref: '#/components/schemas/Build'
  exportSettings:
    caller: A reader who presses Export.
    description: Saves the settings as a JSON file, without tokens.
    input:
      type: object
    output:
      $ref: '#/components/schemas/Settings'
  importSettings:
    caller: A reader who presses Import and picks a JSON file.
    description: Reads settings from the file, migrating an older version.
    input:
      $ref: '#/components/schemas/Settings'
    output:
      $ref: '#/components/schemas/ImportSettingsOutput'
components:
  schemas:
    OpenWorkspaceInput:
      type: object
      description: >
        Before reading, the load captures these choices, the configuration
        override or choice to use the workspace configuration, and the token
        selections. Token values stay private and are absent from the output.
      required: [workspace]
      properties:
        workspace:
          type: string
          description: owner/repo for a repository, or the name of a folder added before.
          example: hieutran21198/Artifact-Driven-Framework
        ref:
          type: string
          description: A branch, a tag or a commit SHA. The default branch when not given. Not used for a folder.
          example: main
        parts:
          $ref: '#/components/schemas/PartChoices'
    PartChoices:
      type: object
      description: For each part whose tests setting names a repository, by part name, the ref and the token picked.
      additionalProperties:
        type: object
        properties:
          ref:
            type: string
          token:
            type: string
            description: The name of a token, or none.
      example: {lending: {ref: feature/renew, token: team}}
    AddWorkspaceInput:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          example: hieutran21198/Artifact-Driven-Framework
        ref:
          type: string
          description: The branch shown. The default branch when not given.
        token:
          type: string
          description: The name of the token to read it with, or none.
          example: team
    ChangeConfigurationInput:
      type: object
      required: [workspace, text]
      properties:
        workspace:
          type: string
          example: hieutran21198/Artifact-Driven-Framework
        text:
          type: string
          description: The configuration as the reader wrote it, in JSON.
    ChangeConfigurationOutput:
      type: object
      required: [valid, problems]
      properties:
        valid:
          type: boolean
          description: True when it is kept and used.
        problems:
          type: array
          description: One line for each problem, with the line of the JSON or the key it is in.
          items:
            type: string
          example: ['services: must be an object']
    CloneScriptOutput:
      type: object
      required: [clipboard]
      properties:
        clipboard:
          type: string
          description: The script. It names no token; git uses the access of the reader.
          example: |
            git clone https://github.com/hieutran21198/Artifact-Driven-Framework.git Artifact-Driven-Framework
            git -C Artifact-Driven-Framework checkout main
    CheckSettingsOutput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: One line for each workspace, each part with a repository, and each token.
          items:
            type: object
            required: [kind, name, connected]
            properties:
              kind:
                type: string
                enum: [workspace, part, token]
              name:
                type: string
                example: lending
              connected:
                type: boolean
              reason:
                type: string
                description: Why the tracker cannot connect, when it cannot.
                enum: [not found, no access, needs a token, token refused, choose the folder again]
    Build:
      type: object
      description: >
        A build and its provenance belong to one load. Later changes to the
        selected inputs cannot relabel it.
      required: [workspace, coverage, unread, provenance]
      properties:
        workspace:
          type: string
        ref:
          type: string
          description: >
            The ref shown. For a folder, the available branch or
            detached-commit label from .git/HEAD is context only; it does
            not identify the contents read.
        commit:
          type: string
          description: >
            The commit SHA the repository ref pointed to when it was read. Absent for a folder, whose files are read from the
            working copy rather than a resolved commit.
        coverage:
          type: array
          description: One line for each goal, as measureCoverage prints it.
          items:
            type: string
          example: ['  G-GATE        60%  criteria 1/2  scenarios 2/4  rules 3/4']
        unread:
          type: array
          description: Each part, repository or file that could not be read, with the reason.
          items:
            type: string
          example: ['lending: needs a token']
        provenance:
          $ref: '#/components/schemas/BuildProvenance'
    BuildProvenance:
      type: object
      additionalProperties: false
      description: >
        The sources and identities of this load, with no token values.
        The part list comes from its effective configuration.
      required: [workspace, parts, configuration, analyzer]
      properties:
        workspace:
          description: >
            The workspace source. A repository workspace has a resolved
            commit when a build is produced.
          oneOf:
            - $ref: '#/components/schemas/RepositorySource'
            - $ref: '#/components/schemas/WorkingCopySource'
        parts:
          type: array
          description: >
            One outcome for each service, each client and e2e when declared
            in the effective configuration.
          items:
            $ref: '#/components/schemas/PartRead'
        configuration:
          type: object
          additionalProperties: false
          required: [source, value, digest]
          properties:
            source:
              type: string
              enum: [workspace, browser_override]
              description: Where this load's effective configuration came from.
            value:
              $ref: '../configuration/openapi.yaml#/components/schemas/Configuration'
            digest:
              type: string
              description: Content identity of the complete effective configuration.
        analyzer:
          type: object
          additionalProperties: false
          required: [digest, python_version]
          properties:
            digest:
              type: string
              description: Content identity of the analysis scripts and site template used.
            python_version:
              type: string
              description: Version of the Python runtime used for the analysis.
    RepositorySource:
      type: object
      additionalProperties: false
      required: [kind, repository, requested_ref, commit]
      properties:
        kind:
          type: string
          enum: [repository]
        repository:
          type: string
          description: The full owner/repo identity of the source.
          example: hieutran21198/Artifact-Driven-Framework
        requested_ref:
          type: string
          description: >
            The branch, tag or commit the reader chose for this source; an
            empty string means its default branch.
          example: main
        commit:
          type: string
          nullable: true
          description: >
            The full resolved commit SHA, never an abbreviated label. Null
            only when resolution failed, with the reason in the part's read
            outcome. Tests in the workspace repository use its resolved
            commit.
    WorkingCopySource:
      type: object
      additionalProperties: false
      description: >
        Source context for a working-copy read set, not an atomic disk
        snapshot or the contents of a Git commit. The folder and Git label
        do not fingerprint the files read. Each load reads the folder again.
      required: [kind, folder]
      properties:
        kind:
          type: string
          enum: [working_copy]
        folder:
          type: string
          description: The identity of the workspace folder read.
        git_label:
          type: string
          description: The available branch or detached-commit label, for context only.
    PartRead:
      type: object
      additionalProperties: false
      required: [group, name, source, status, reason]
      properties:
        group:
          type: string
          enum: [service, client, e2e]
          description: Together with name, identifies the part in the effective configuration.
        name:
          type: string
          description: The service or client name, or e2e for the end-to-end tests.
        source:
          description: >
            The source of this part's tests. A part with no tests setting
            names the workspace source, not an inferred repository.
          oneOf:
            - $ref: '#/components/schemas/RepositorySource'
            - $ref: '#/components/schemas/WorkingCopySource'
        status:
          type: string
          enum: [complete, failed, missing]
          description: >
            The test-read outcome, not a test result or coverage score.
            Only complete parts contribute their files.
        reason:
          type: string
          nullable: true
          description: >
            Null for complete; the specific missing-tests or read-failure
            reason otherwise, including an unresolved source.
    ListRefsInput:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          example: hieutran21198/Artifact-Driven-Framework
    ListRefsOutput:
      type: object
      required: [default_branch, branches, tags]
      properties:
        default_branch:
          type: string
        branches:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    SetTokenInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The name the reader gives the token, which the settings keep.
          example: team
        value:
          type: string
          description: A read-only token. Empty removes the token.
    Settings:
      type: object
      required: [version, workspaces]
      properties:
        version:
          type: integer
          description: The version of the settings.
          example: 2
        workspaces:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                example: hieutran21198/Artifact-Driven-Framework
              ref:
                type: string
              token:
                type: string
                description: The name of the token picked, never its value.
              parts:
                $ref: '#/components/schemas/PartChoices'
              configuration:
                $ref: '../configuration/openapi.yaml#/components/schemas/Configuration'
    ImportSettingsOutput:
      type: object
      required: [stored]
      properties:
        stored:
          type: boolean
          description: False when the file is of a newer version, which is shown with a warning and not stored.
