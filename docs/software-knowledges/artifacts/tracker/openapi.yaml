openapi: 3.0.3
info:
  title: Tracker artifact
  version: 0.1.0
  description: >
    Contract of the tracker artifact. Written before the code (contract
    first); the tracker service implements it. It has no HTTP endpoint; the
    actions of a reader on the page are under x-commands.
servers:
  - url: http://localhost
    description: No server; the page runs in the browser of the reader.
paths: {}
x-commands:
  openWorkspace:
    caller: The page when it opens with a workspace in its address, or a reader who presses Load.
    description: >
      Reads the commit and the file tree of the workspace's ref and of each
      part's ref, downloads the files it does not keep, and shows the build,
      building again only when a commit or the configuration changed
      (TRK-1 to TRK-5, TRK-9).
    input:
      $ref: '#/components/schemas/OpenWorkspaceInput'
    output:
      $ref: '#/components/schemas/Build'
  listRefs:
    caller: A reader who opens the ref field of a repository or of a part.
    description: Lists the branches and tags of the repository, the default branch first (TRK-1, TRK-4).
    input:
      $ref: '#/components/schemas/ListRefsInput'
    output:
      $ref: '#/components/schemas/ListRefsOutput'
  setToken:
    caller: A reader who sets or removes a token in the settings.
    description: Keeps a read-only token under a name until the tab closes, or removes it (TRK-6).
    input:
      $ref: '#/components/schemas/SetTokenInput'
    output:
      type: object
  addWorkspace:
    caller: A reader who adds a repository in the settings.
    description: Adds the repository with its branch and the token picked, or none, and checks it (TRK-6, TRK-7, TRK-11).
    input:
      $ref: '#/components/schemas/AddWorkspaceInput'
    output:
      $ref: '#/components/schemas/CheckSettingsOutput'
  removeWorkspace:
    caller: A reader who removes a workspace in the settings.
    description: Removes the workspace from the settings and the workspace picker (TRK-7).
    input:
      type: object
      required: [workspace]
      properties:
        workspace:
          type: string
          example: hieutran21198/Artifact-Driven-Framework
    output:
      type: object
  checkSettings:
    caller: The page when the settings open, or a reader who asks to check again.
    description: Checks each workspace, each part its configuration names and each token, with one call to GitHub for each repository and each token (TRK-11).
    input:
      type: object
    output:
      $ref: '#/components/schemas/CheckSettingsOutput'
  changeConfiguration:
    caller: A reader who edits the configuration of a workspace in the settings.
    description: Validates the configuration given and, when it is valid, keeps it for the workspace in this browser and uses it in place of the workspace's (TRK-12).
    input:
      $ref: '#/components/schemas/ChangeConfigurationInput'
    output:
      $ref: '#/components/schemas/ChangeConfigurationOutput'
  restoreConfiguration:
    caller: A reader who goes back to the configuration of the workspace.
    description: Drops the configuration changed in this browser for the workspace (TRK-12).
    input:
      type: object
      required: [workspace]
      properties:
        workspace:
          type: string
    output:
      type: object
  copyCloneScript:
    caller: A reader who copies the clone script of a workspace in the settings.
    description: Puts on the clipboard a shell script that clones the workspace and the repository of each part at the refs picked (TRK-13).
    input:
      type: object
      required: [workspace]
      properties:
        workspace:
          type: string
          example: hieutran21198/Artifact-Driven-Framework
    output:
      $ref: '#/components/schemas/CloneScriptOutput'
  addFolder:
    caller: A reader who adds a folder on their computer as a workspace.
    description: Adds the folder to the workspaces and opens it (TRK-8).
    input:
      type: object
    output:
      $ref: '#/components/schemas/Build'
  exportSettings:
    caller: A reader who presses Export.
    description: Saves the settings as a JSON file, without tokens (TRK-6, TRK-7).
    input:
      type: object
    output:
      $ref: '#/components/schemas/Settings'
  importSettings:
    caller: A reader who presses Import and picks a JSON file.
    description: Reads settings from the file, migrating an older version (TRK-7).
    input:
      $ref: '#/components/schemas/Settings'
    output:
      $ref: '#/components/schemas/ImportSettingsOutput'
components:
  schemas:
    OpenWorkspaceInput:
      type: object
      required: [workspace]
      properties:
        workspace:
          type: string
          description: owner/repo for a repository, or the name of a folder added before.
          example: hieutran21198/Artifact-Driven-Framework
        ref:
          type: string
          description: A branch, a tag or a commit SHA. The default branch when not given. Not used for a folder (TRK-8).
          example: main
        parts:
          $ref: '#/components/schemas/PartChoices'
    PartChoices:
      type: object
      description: For each part whose tests setting names a repository, by part name, the ref and the token picked (TRK-4, TRK-6).
      additionalProperties:
        type: object
        properties:
          ref:
            type: string
          token:
            type: string
            description: The name of a token, or none.
      example: {lending: {ref: feature/renew, token: team}}
    AddWorkspaceInput:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          example: hieutran21198/Artifact-Driven-Framework
        ref:
          type: string
          description: The branch shown. The default branch when not given.
        token:
          type: string
          description: The name of the token to read it with, or none (TRK-6).
          example: team
    ChangeConfigurationInput:
      type: object
      required: [workspace, text]
      properties:
        workspace:
          type: string
          example: hieutran21198/Artifact-Driven-Framework
        text:
          type: string
          description: The configuration as the reader wrote it, in JSON.
    ChangeConfigurationOutput:
      type: object
      required: [valid, problems]
      properties:
        valid:
          type: boolean
          description: True when it is kept and used (TRK-12).
        problems:
          type: array
          description: One line for each problem, with the line of the JSON or the key it is in.
          items:
            type: string
          example: ['services: must be an object']
    CloneScriptOutput:
      type: object
      required: [clipboard]
      properties:
        clipboard:
          type: string
          description: The script. It names no token; git uses the access of the reader (TRK-13).
          example: |
            git clone https://github.com/hieutran21198/Artifact-Driven-Framework.git Artifact-Driven-Framework
            git -C Artifact-Driven-Framework checkout main
    CheckSettingsOutput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: One line for each workspace, each part with a repository, and each token (TRK-11).
          items:
            type: object
            required: [kind, name, connected]
            properties:
              kind:
                type: string
                enum: [workspace, part, token]
              name:
                type: string
                example: lending
              connected:
                type: boolean
              reason:
                type: string
                description: Why the tracker cannot connect, when it cannot.
                enum: [not found, no access, needs a token, token refused, choose the folder again]
    Build:
      type: object
      required: [workspace, coverage, unread]
      properties:
        workspace:
          type: string
        ref:
          type: string
          description: The ref shown. For a folder, the branch that .git/HEAD names (TRK-8).
        commit:
          type: string
          description: The commit SHA the ref pointed to when it was read (TRK-5).
        coverage:
          type: array
          description: One line for each goal, as measureCoverage prints it (TRK-3).
          items:
            type: string
          example: ['  G-GATE        60%  criteria 1/2  scenarios 2/4  rules 3/4']
        unread:
          type: array
          description: Each part, repository or file that could not be read, with the reason (TRK-4, TRK-9).
          items:
            type: string
          example: ['lending: needs a token']
    ListRefsInput:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          example: hieutran21198/Artifact-Driven-Framework
    ListRefsOutput:
      type: object
      required: [default_branch, branches, tags]
      properties:
        default_branch:
          type: string
        branches:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    SetTokenInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The name the reader gives the token, which the settings keep (TRK-6).
          example: team
        value:
          type: string
          description: A read-only token. Empty removes the token.
    Settings:
      type: object
      required: [version, workspaces]
      properties:
        version:
          type: integer
          description: The version of the settings (TRK-7).
          example: 2
        workspaces:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                example: hieutran21198/Artifact-Driven-Framework
              ref:
                type: string
              token:
                type: string
                description: The name of the token picked, never its value (TRK-6).
              parts:
                $ref: '#/components/schemas/PartChoices'
              configuration:
                $ref: '../configuration/openapi.yaml#/components/schemas/Configuration'
    ImportSettingsOutput:
      type: object
      required: [stored]
      properties:
        stored:
          type: boolean
          description: False when the file is of a newer version, which is shown with a warning and not stored (TRK-7).
