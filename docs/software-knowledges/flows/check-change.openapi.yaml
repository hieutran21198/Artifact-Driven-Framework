openapi: 3.0.3
info:
  title: Check a change flow
  version: 0.1.0
  description: >
    Contract of the Check a change flow: the docs check, which crosses the
    repository and knowledge artifacts, and the test check, which crosses the
    test and knowledge artifacts. The scripts service serves both. It has no
    HTTP endpoint; its commands are under x-commands.
servers:
  - url: http://localhost
    description: No server; the commands run on the machine of the caller.
paths: {}
x-commands:
  checkDocs:
    caller: A person or CI, at the root of a workspace or in any folder under it.
    description: >
      python3 scripts/check_docs.py. Checks links, anchors, knowledge IDs,
      citation direction, and scenarios and their operations. Validates explicitly declared local and shared
      Flow rules and their citations while preserving existing artifact ID
      forms.
    input:
      $ref: '#/components/schemas/CheckDocsInput'
    output:
      $ref: '#/components/schemas/CheckOutput'
  checkTests:
    caller: A person or CI, on the checkout of a code change.
    description: >
      python3 scripts/check_tests.py [folder]. Checks that test files name
      only knowledge IDs that exist and are not withdrawn when their complete
      prefix occurs in the knowledge. An unknown complete prefix is ignored,
      including an unknown Flow-rule scope.
    input:
      $ref: '#/components/schemas/CheckTestsInput'
    output:
      $ref: '#/components/schemas/CheckOutput'
components:
  schemas:
    CheckDocsInput:
      type: object
      description: The command takes no argument. It reads the configuration at the root.
    CheckTestsInput:
      type: object
      properties:
        folder:
          type: string
          description: >
            The only argument, relative to the root. The tests folder to read
            instead of the tests of every part. When it is the folder of a
            part, the glob of that part applies.
          example: services/lending
    CheckOutput:
      type: object
      required: [exit_status, stdout, stderr]
      properties:
        exit_status:
          type: integer
          enum: [0, 1, 2]
          description: 0 when the check finds no problem, 1 when it finds one, 2 when it cannot run, such as a folder that does not exist or a configuration that is not valid JSON.
        stdout:
          allOf:
            - $ref: '../system/openapi.yaml#/components/schemas/Lines'
          description: On success, one line that says what passed, or that there are no tests to check.
        stderr:
          allOf:
            - $ref: '../system/openapi.yaml#/components/schemas/Problems'
          description: Every problem found in the run.
