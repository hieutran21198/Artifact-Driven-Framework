openapi: 3.0.3
info:
  title: Measure coverage flow
  version: 0.1.0
  description: >
    Contract of the Measure coverage flow: the coverage and the fragility
    commands, which cross the test and knowledge artifacts. The scripts
    service serves both. It has no HTTP endpoint; its commands are under
    x-commands.
servers:
  - url: http://localhost
    description: No server; the commands run on the machine of the caller.
paths: {}
x-commands:
  measureCoverage:
    caller: A person, in any folder of a workspace.
    description: >
      python3 scripts/impact.py --coverage [folder]. Prints, for each goal,
      the share of its criteria, scenarios and rules that test files name, and
      the ones no test file names (F-COVER-1 to F-COVER-6).
    input:
      $ref: '#/components/schemas/TestsFolderInput'
    output:
      $ref: '#/components/schemas/MeasureCoverageOutput'
  rankFragile:
    caller: A person, in any folder of a workspace.
    description: >
      python3 scripts/impact.py --fragile [folder]. Prints the 20 most fragile
      requirements, rules, operations and schemas (F-COVER-7, F-COVER-8).
    input:
      $ref: '#/components/schemas/TestsFolderInput'
    output:
      $ref: '#/components/schemas/RankFragileOutput'
components:
  schemas:
    TestsFolderInput:
      type: object
      properties:
        folder:
          type: string
          description: >
            The only argument besides the option, relative to the root. The
            tests folder to read instead of the tests of every part. When it
            is the folder of a part, the glob of that part applies
            (F-COVER-6).
          example: tests/scripts
    MeasureCoverageOutput:
      type: object
      required: [exit_status, stdout, stderr]
      properties:
        exit_status:
          type: integer
          enum: [0, 1]
          description: 0 when measured, 1 when the folder does not exist or there are no test files to read (F-COVER-4).
        stdout:
          allOf:
            - $ref: '../system/openapi.yaml#/components/schemas/Lines'
          description: >
            One line for each goal - its key, the tested share as a percent,
            and criteria, scenarios and rules as tested out of all - followed
            by a line of the IDs no test file names, in the order of their
            numbers. Then one line for the whole knowledge (F-COVER-1,
            F-COVER-3).
          example: ['  G-GATE        60%  criteria 1/2  scenarios 2/4  rules 3/4']
        stderr:
          allOf:
            - $ref: '../system/openapi.yaml#/components/schemas/Lines'
          description: Why nothing was measured (F-COVER-4).
    RankFragileOutput:
      type: object
      required: [exit_status, stdout]
      properties:
        exit_status:
          type: integer
          enum: [0, 1]
          description: 0 when ranked, 1 when the folder given does not exist.
        stdout:
          allOf:
            - $ref: '../system/openapi.yaml#/components/schemas/Lines'
          description: >
            How the score is made, then one line for each of the 20 most
            fragile units - rank, score, name, scenarios, operations, client
            pages, the scenarios that cite it, the test files that name it or
            - when no test files are read, and whether an open question names
            it (F-COVER-7, F-COVER-8).
