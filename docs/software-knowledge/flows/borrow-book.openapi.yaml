openapi: 3.0.3
info:
  title: Borrow a book flow
  version: 0.1.0
  description: >
    Contract of the Borrow a book flow. The endpoint crosses the book and
    member artifacts, so the flow owns it; it reuses the artifact schemas.
servers:
  - url: http://localhost:8080
    description: Local backend
security:
  - memberBearer: []
paths:
  /v1/books/{id}/borrow:
    post:
      operationId: borrowBook
      summary: Lend an available book to the signed-in member (F-BORROW-1 to F-BORROW-6).
      parameters:
        - $ref: '../artifacts/book/openapi.yaml#/components/parameters/BookID'
      responses:
        '200':
          description: The book, now on loan, with its due time (F-BORROW-1).
          content:
            application/json:
              schema:
                $ref: '../artifacts/book/openapi.yaml#/components/schemas/BookResponse'
        '401':
          $ref: '../system/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../system/openapi.yaml#/components/responses/NotFound'
        '422':
          $ref: '../system/openapi.yaml#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    memberBearer:
      $ref: '../system/openapi.yaml#/components/securitySchemes/memberBearer'
