<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--bg:#fbfcfd;--card:#ffffff;--panel:#f1f4f7;--ink:#1f2933;--muted:#5f6b78;--faint:#94a0ab;--line:#e3e8ed;--accent:#2f6db5;--accent-bg:#e8f0fa;--up:#b8542c;--up-bg:#fbece5;--down:#2f7d57;--down-bg:#e6f2e8;--warn:#8a5a12;--warn-bg:#fbf3e4;--c0:#ecebfb;--c0i:#3d3a8a;--c1:#e2f3ec;--c1i:#1f6a4f;--c2:#fbe9ee;--c2i:#8a3352;--c3:#f6f3ec;--c3i:#6b5d3a;--c4:#e4f0fb;--c4i:#245b8f;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
/* Light only, like the landing page: the page keeps its colors on a dark system theme. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body)}
main{max-width:1120px;margin:0 auto;padding:32px max(20px,env(safe-area-inset-right,0px)) 72px max(20px,env(safe-area-inset-left,0px))}
h1,h2{font-family:var(--serif);font-weight:400;line-height:1.2;text-wrap:balance}h1{font-size:clamp(30px,5vw,40px);margin:0}h2{font-size:26px;margin:48px 0 6px}h3{font-size:15px;font-weight:600;margin:0}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
code{font-family:var(--mono);font-size:.88em}
.sub{color:var(--muted);font-size:14px;margin:4px 0 18px;max-width:72ch}
nav{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px;margin:16px 0 0;padding-bottom:16px;border-bottom:1px solid var(--line)}nav a{color:var(--accent);text-decoration:none}nav a:hover{text-decoration:underline}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.metric .k{color:var(--faint);font-size:12px}.metric .v{font:400 32px/1.2 var(--serif);font-variant-numeric:tabular-nums}.metric .n{color:var(--muted);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--down);border-radius:4px}
.row{display:grid;grid-template-columns:90px 1fr 90px;gap:12px;align-items:center;font-size:13px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--faint);font-weight:400;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;white-space:nowrap;font-size:11px;padding:1px 7px;border-radius:999px;margin:1px 2px 1px 0;font-family:var(--mono)}
.p0{background:var(--c0);color:var(--c0i)}.p1{background:var(--c1);color:var(--c1i)}.p2{background:var(--c2);color:var(--c2i)}.p3{background:var(--c3);color:var(--c3i)}.p4{background:var(--c4);color:var(--c4i)}
.gap{background:var(--warn-bg);color:var(--warn)}
details{margin-top:8px}summary{cursor:pointer;color:var(--accent);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
button.plain{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:13px var(--body);cursor:pointer;white-space:nowrap;flex:none}
.explorer{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
@media (max-width:860px){.explorer{grid-template-columns:minmax(0,1fr)}}
.graph{overflow-x:auto}svg text{font-size:11px;fill:var(--ink);dominant-baseline:central;font-family:var(--mono)}
svg .head{fill:var(--muted);font-family:inherit;font-size:12px}
.node{cursor:pointer}.node rect{stroke:transparent}.node.sel rect{stroke:var(--ink);stroke-width:1.5}
.node.dim{opacity:.15}.edge{fill:none;stroke:var(--muted);stroke-width:.6;opacity:.25}.edge.up{stroke:var(--up);opacity:.9;stroke-width:1.2}.edge.down{stroke:var(--down);opacity:.9;stroke-width:1.2}.edge.off{opacity:.03}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.detail h3{margin-bottom:6px}.detail dl{margin:0;font-size:13px}.detail dt{color:var(--muted);margin-top:8px}.detail dd{margin:0}
.muted{color:var(--muted)}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
ul.tight{margin:6px 0 0;padding-left:18px;font-size:13px}
.picker{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.drop{position:relative;min-width:280px;margin:0}.drop summary{list-style:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);background:var(--card);font-size:14px}.drop summary::-webkit-details-marker{display:none}.drop summary::after{content:"▾";float:right;margin-left:12px;color:var(--muted)}
.drop-list{position:absolute;z-index:5;top:42px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;max-height:320px;overflow:auto}
.drop-list label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;font-size:14px;cursor:pointer}.drop-list label:hover{background:var(--panel)}.drop-list label.off{opacity:.45;cursor:not-allowed}.drop-list hr{border:0;border-top:1px solid var(--line);margin:4px 0}
button.primary{border:1px solid var(--ink);background:var(--ink);color:var(--card);border-radius:999px;padding:8px 18px;font:500 14px var(--body);cursor:pointer}button.primary[disabled]{opacity:.45;cursor:not-allowed}
#run-note{font-size:13px;align-self:center}
/* Wide drawings scroll inside their card, so the page never scrolls sideways. */
.card div:has(> svg),.explorer > .card,.card:has(> table){overflow-x:auto;min-width:0}
/* Goals: cards of one height, six to a page; the criteria and flows open in a side panel. */
.goal-card{display:flex;flex-direction:column;gap:10px;height:200px}
.goal-card h3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.goal-card .open{margin-top:auto;align-self:flex-start}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;font-size:14px;color:var(--muted)}.pager:empty{display:none}
.side-back{position:fixed;inset:0;background:rgba(31,41,51,.28);z-index:20}
.side{position:fixed;top:0;right:0;height:100vh;width:min(600px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(31,41,51,.12);z-index:21;overflow:auto;padding:24px max(20px,env(safe-area-inset-right,0px)) 40px 24px}
.side-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}.side-head h2{margin:0;font-size:24px}
.slides{margin-bottom:12px;transition:box-shadow .3s}.slides.flash{box-shadow:0 0 0 2px var(--accent)}
.to-flow{cursor:pointer}.to-flow:hover rect,.to-flow:hover path,.to-flow:focus-visible rect,.to-flow:focus-visible path{stroke:var(--accent)!important;stroke-width:2px!important}.to-flow:focus{outline:none}.slide-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.slide-nav{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.slide-nav button[disabled]{opacity:.4;cursor:default}
.diagram{overflow-x:auto}.diagram svg{max-width:100%;height:auto}.diagram pre{font-size:12px;white-space:pre;margin:8px 0 0;color:var(--muted)}
</style>
<script type="module">
// Mermaid with the ELK layout: right-angled edges that share their route, and fewer crossings.
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@12.1.0/dist/mermaid.esm.min.mjs";
import elk from "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@1.0.1/dist/mermaid-layout-elk.esm.min.mjs";
mermaid.registerLayoutLoaders(elk);
window.mermaid = mermaid;
if (window.mermaidReady) mermaidReady();
</script>
</head>
<body>
<main>
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><h1 data-i="title"></h1><div class="chips" style="margin:0" role="group" aria-label="Language"><button class="chip" data-lang="en">EN</button><button class="chip" data-lang="vi">VI</button></div></div>
<div class="sub" id="stamp"></div>
<nav><a href="#overview" data-i="nav.overview"></a><a href="#guide" data-i="nav.guide"></a><a href="#analyze" data-i="nav.analyze"></a><a href="#coverage" data-i="nav.coverage"></a><a href="#goals" data-i="nav.goals"></a><a href="#diagrams" data-i="nav.diagrams"></a><a href="#explorer" data-i="nav.explorer"></a><a href="#radius" data-i="nav.radius"></a><a href="#gaps" data-i="nav.gaps"></a><a href="#clients" data-i="nav.clients"></a></nav>

<section id="overview"><h2 data-i="nav.overview"></h2><p class="sub" data-i="overview.sub"></p><div class="grid" id="metrics"></div></section>

<section id="guide"><h2 data-i="nav.guide"></h2><p class="sub" data-i="guide.sub"></p>
<div class="card" style="margin-bottom:12px"><h3 data-i="map.title"></h3><p class="sub" data-i="map.sub"></p><div style="overflow-x:auto"><svg id="map" width="100%" style="min-width:640px" role="img" aria-labelledby="map-title"><title id="map-title">Knowledge layers</title></svg></div></div>
<div class="two"><div class="card"><h3 data-i="guide.parts"></h3><table data-i="guide.partsTable"></table></div><div class="card"><h3 data-i="guide.numbers"></h3><table data-i="guide.numbersTable"></table></div></div></section>

<section id="analyze"><h2 data-i="nav.analyze"></h2><p class="sub" data-i="analyze.sub"></p>
<div class="card picker"><details class="drop" id="drop"><summary id="drop-label"></summary><div class="drop-list" id="goal-options"></div></details><button class="primary" id="run"></button><span class="muted" id="run-note"></span></div></section>

<div id="results" hidden>
<section id="summary"><h2 data-i="summary.title"></h2><p class="sub" id="summary-sub"></p><div class="grid" id="slice-metrics"></div></section>

<section id="coverage"><h2 data-i="nav.coverage"></h2><p class="sub" data-i="coverage.sub"></p><div class="card" id="coverage-bars"></div></section>

<section id="goals"><h2 data-i="nav.goals"></h2><p class="sub" data-i="goals.sub"></p><div class="two" id="goal-cards"></div><div class="pager" id="goal-pager"></div></section>

<section id="diagrams"><h2 data-i="nav.diagrams"></h2><p class="sub" data-i="diagrams.sub"></p><div id="diagram-cards"></div></section>

<section id="explorer"><h2 data-i="nav.explorer"></h2><p class="sub" data-i="explorer.sub"></p>
<div class="explorer"><div class="card graph"><div class="legend" id="legend"></div><svg id="g" width="100%"></svg></div><div class="card detail" id="detail"></div></div></section>

<section id="radius"><h2 data-i="nav.radius"></h2><p class="sub" data-i="radius.sub"></p><div class="card"><table id="radius-table"></table></div></section>

<section id="gaps"><h2 data-i="nav.gaps"></h2><p class="sub" data-i="gaps.sub"></p><div class="two" id="gap-cards"></div></section>

<section id="clients"><h2 data-i="nav.clients"></h2><p class="sub" data-i="clients.sub"></p><div class="two" id="client-cards"></div></section>
</div>
</main>
<div class="side-back" id="side-back" hidden></div>
<aside class="side" id="side" hidden aria-modal="true" role="dialog" aria-labelledby="side-title"><div class="side-head"><h2 id="side-title"></h2><button class="plain" id="side-close"></button></div><div id="side-body"></div></aside>
