<style>
:root{--bg:#fbfcfd;--card:#ffffff;--panel:#f1f4f7;--ink:#1f2933;--muted:#5f6b78;--faint:#94a0ab;--line:#e3e8ed;--accent:#2f6db5;--accent-bg:#e8f0fa;--up:#b8542c;--up-bg:#fbece5;--down:#2f7d57;--down-bg:#e6f2e8;--warn:#8a5a12;--warn-bg:#fbf3e4;--c0:#ecebfb;--c0i:#3d3a8a;--c1:#e2f3ec;--c1i:#1f6a4f;--c2:#fbe9ee;--c2i:#8a3352;--c3:#f6f3ec;--c3i:#6b5d3a;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
/* Light only, like the landing page: the page keeps its colors on a dark system theme. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body)}
main{max-width:1120px;margin:0 auto;padding:32px max(20px,env(safe-area-inset-right,0px)) 72px max(20px,env(safe-area-inset-left,0px))}
h1,h2{font-family:var(--serif);font-weight:400;line-height:1.2;text-wrap:balance}h1{font-size:clamp(30px,5vw,40px);margin:0}h2{font-size:26px;margin:48px 0 6px}h3{font-size:15px;font-weight:600;margin:0}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
code{font-family:var(--mono);font-size:.88em}
.sub{color:var(--muted);font-size:14px;margin:4px 0 18px;max-width:72ch}
nav{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px;margin:16px 0 0;padding-bottom:16px;border-bottom:1px solid var(--line)}nav a{color:var(--accent);text-decoration:none}nav a:hover{text-decoration:underline}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.metric .k{color:var(--faint);font-size:12px}.metric .v{font:400 32px/1.2 var(--serif);font-variant-numeric:tabular-nums}.metric .n{color:var(--muted);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--down);border-radius:4px}
.row{display:grid;grid-template-columns:90px 1fr 90px;gap:12px;align-items:center;font-size:13px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--faint);font-weight:400;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;white-space:nowrap;font-size:11px;padding:1px 7px;border-radius:999px;margin:1px 2px 1px 0;font-family:var(--mono)}
.p0{background:var(--c0);color:var(--c0i)}.p1,.p5{background:var(--c1);color:var(--c1i)}.p2{background:var(--c2);color:var(--c2i)}.p3{background:var(--c3);color:var(--c3i)}
.gap{background:var(--warn-bg);color:var(--warn)}
details{margin-top:8px}summary{cursor:pointer;color:var(--accent);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
button.plain{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:13px var(--body);cursor:pointer;white-space:nowrap;flex:none}
.muted{color:var(--muted)}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
ul.tight{margin:6px 0 0;padding-left:18px;font-size:13px}
.picker{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.drop{position:relative;min-width:280px;margin:0}.drop summary{list-style:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);background:var(--card);font-size:14px}.drop summary::-webkit-details-marker{display:none}.drop summary::after{content:"▾";float:right;margin-left:12px;color:var(--muted)}
.drop-list{position:absolute;z-index:5;top:42px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;max-height:320px;overflow:auto}
.drop-list label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;font-size:14px;cursor:pointer}.drop-list label:hover{background:var(--panel)}.drop-list label.off{opacity:.45;cursor:not-allowed}.drop-list label .muted{white-space:nowrap;margin-left:auto;font-family:var(--mono);font-size:12px}.drop-list hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* The system diagram is wide: it takes its own row and scrolls inside its card on a phone. */
.stack{display:grid;gap:12px}.stack>.card{min-width:0}#guide-system{overflow-x:auto}#guide-system svg{min-width:640px}
button.primary{border:1px solid var(--ink);background:var(--ink);color:var(--card);border-radius:999px;padding:8px 18px;font:500 14px var(--body);cursor:pointer}button.primary[disabled]{opacity:.45;cursor:not-allowed}
#run-note{font-size:13px;align-self:center}
/* Wide drawings scroll inside their card, so the page never scrolls sideways. */
.card div:has(> svg),.card:has(> table){overflow-x:auto;min-width:0}
/* Goals: six to a page; the criteria and flows open in a side panel. */
.goal-card{display:flex;flex-direction:column;gap:10px}
/* The story of a goal: goal, flows, rules, artifacts, drawn from the knowledge. Blocks wrap; lines join them. */
.story{margin-top:12px}.story-head{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center}.story-head h3{margin:0}
.story .steps{display:flex;gap:4px 16px;flex-wrap:wrap}.story .steps button{font:14px var(--body);color:var(--faint);background:none;border:0;border-bottom:1px solid transparent;padding:6px 0;cursor:pointer}
.story .steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--ink)}
.stage{position:relative;display:grid;gap:28px;margin-top:14px;padding:6px 0}.stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stage path{fill:none;stroke:var(--faint);stroke-width:1.2}
.srow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;position:relative;z-index:1}.scol{flex:1 1 220px;min-width:0;max-width:420px;display:grid;gap:8px;align-content:start;justify-items:center}
.node{border:0;border-radius:12px;padding:7px 12px;font:13px/1.35 var(--body);text-align:left;cursor:pointer;color:var(--ink);max-width:100%;overflow-wrap:anywhere}
.node b{display:block;font-weight:400;font-size:11px;opacity:.8}.node:hover,.node.sel{box-shadow:0 0 0 1.5px var(--muted)}
.n-goal{background:var(--c0);color:var(--c0i)}.n-flow{background:var(--c1);color:var(--c1i)}.n-rule{background:var(--c2);color:var(--c2i);border-radius:8px;padding:3px 9px;font-size:12px}.n-art{background:transparent;color:var(--c3i);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.sart{flex:1 1 220px;min-width:0;max-width:420px;background:var(--c3);border-radius:16px;padding:8px 10px 12px;display:grid;gap:6px;justify-items:center;align-content:start}
.stage [data-from]{display:none}.stage .on{display:revert}.stage .chips.on,.stage .srow.on{display:flex}.stage .sart.on{display:grid}
@media (prefers-reduced-motion:no-preference){.stage .on{animation:rise .6s ease both}@keyframes rise{from{opacity:0;transform:translateY(6px)}}.stage path{transition:opacity .6s}}
#story-cap{margin:10px 0 0;font-size:15px}.side h3{margin:20px 0 6px}.side dl{margin:0}.side dt{color:var(--muted);font-size:13px;margin-top:8px}.side dd{margin:0}
button.pill{border:0;cursor:pointer;font-family:var(--mono)}.src{font-size:13px;margin-top:20px}
.goal-card .open{margin-top:auto;align-self:flex-start}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;font-size:14px;color:var(--muted)}.pager:empty{display:none}
.side-back{position:fixed;inset:0;background:rgba(31,41,51,.28);z-index:20}
.side{position:fixed;top:0;right:0;height:100vh;width:min(600px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(31,41,51,.12);z-index:21;overflow:auto;padding:24px max(20px,env(safe-area-inset-right,0px)) 40px 24px}
.side-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}.side-head h2{margin:0;font-size:24px}
.slides{margin-bottom:12px;transition:box-shadow .3s}.slides.flash{box-shadow:0 0 0 2px var(--accent)}
.to-flow{cursor:pointer}.to-flow:hover rect,.to-flow:hover path,.to-flow:focus-visible rect,.to-flow:focus-visible path{stroke:var(--accent)!important;stroke-width:2px!important}.to-flow:focus{outline:none}.slide-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.slide-nav{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.slide-nav button[disabled]{opacity:.4;cursor:default}
.diagram{overflow-x:auto}.diagram svg{max-width:100%;height:auto}.diagram pre{font-size:12px;white-space:pre;margin:8px 0 0;color:var(--muted)}
</style>
<script type="module">
// Mermaid with the ELK layout: right-angled edges that share their route, and fewer crossings.
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@12.1.0/dist/mermaid.esm.min.mjs";
import elk from "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@1.0.1/dist/mermaid-layout-elk.esm.min.mjs";
mermaid.registerLayoutLoaders(elk);
window.mermaid = mermaid;
if (window.mermaidReady) mermaidReady();
</script>

<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><h1 data-i="title"></h1><div class="chips" style="margin:0" role="group" aria-label="Language"><button class="chip" data-lang="en">EN</button><button class="chip" data-lang="vi">VI</button></div></div>
<div class="sub" id="stamp"></div>

<section id="overview"><h2 data-i="nav.overview"></h2><p class="sub" data-i="overview.sub"></p><div class="grid" id="metrics"></div></section>

<div class="card" style="margin-bottom:12px"><h3 data-i="map.title"></h3><p class="sub" data-i="map.sub"></p><div style="overflow-x:auto"><svg id="map" width="100%" style="min-width:640px" role="img" aria-labelledby="map-title"><title id="map-title">Knowledge layers</title></svg></div></div>

<section id="analyze"><h2 data-i="nav.analyze"></h2><p class="sub" data-i="analyze.sub"></p>
<div class="card picker"><details class="drop" id="drop"><summary id="drop-label"></summary><div class="drop-list" id="goal-options"></div></details><button class="primary" id="run"></button><span class="muted" id="run-note"></span></div></section>

<div id="results" hidden>
<section id="summary"><h2 data-i="summary.title"></h2><p class="sub" id="summary-sub"></p><div class="grid" id="slice-metrics"></div></section>

<section id="coverage"><h2 data-i="nav.coverage"></h2><p class="sub" data-i="coverage.sub"></p><div class="card" id="coverage-bars"></div></section>

<section id="goals"><h2 data-i="nav.goals"></h2><p class="sub" data-i="goals.sub"></p><div class="two" id="goal-cards"></div><div class="pager" id="goal-pager"></div>
<div class="card story" id="story" hidden><div class="story-head"><h3 id="story-title"></h3><div class="steps" id="story-steps" role="group"></div><button class="plain" id="story-play" type="button"></button></div>
<div class="stage" id="story-stage"><svg id="story-lines" aria-hidden="true"></svg><div class="srow" id="story-goal"></div><div class="srow" id="story-flows"></div><div class="srow" id="story-arts" data-from="3"></div></div>
<p id="story-cap" aria-live="polite"></p><p class="sub" style="margin:0" data-i="story.hint"></p></div></section>

<section id="diagrams"><h2 data-i="nav.diagrams"></h2><p class="sub" data-i="diagrams.sub"></p><div id="diagram-cards"></div></section>

</div>
</main>
<div class="side-back" id="side-back" hidden></div>
<aside class="side" id="side" hidden aria-modal="true" role="dialog" aria-labelledby="side-title"><div class="side-head"><h2 id="side-title"></h2><button class="plain" id="side-close"></button></div><div id="side-body"></div></aside>

function mermaidReady(){mermaid.initialize({...mermaidTheme(),startOnLoad:false,securityLevel:"strict",suppressErrorRendering:true,

function diagramSourceAllowed(code){

  && !/%%\s*\{|^\s*---|(?:https?|javascript|vbscript|data|file|blob)\s*:|\/\/|url\s*\(|@import|\\|(?:src|href)\s*=|!\[|@\{|<\/?[a-z!]/im.test(markup)

const SVG_TAGS=new Set("svg g defs marker path rect circle ellipse line polyline polygon text tspan textPath title desc clipPath mask linearGradient radialGradient stop style".split(" "));

const SVG_STYLES=new Set("fill stroke color background-color opacity fill-opacity stroke-opacity stroke-width stroke-dasharray stroke-dashoffset stroke-linecap stroke-linejoin stroke-miterlimit font-family font-size font-weight font-style text-anchor dominant-baseline alignment-baseline display visibility white-space rx ry marker-start marker-mid marker-end clip-path stop-color stop-opacity".split(" "));
function safeSvgValue(value){

function safeDiagram(svg,id){

  result.style.width="100%";result.style.maxWidth=box.width+"px";result.style.height="auto";

}
function drawDiagrams(list){shown=list.sort((a,b)=>LAYER.findIndex(l=>a.page.startsWith(l))-LAYER.findIndex(l=>b.page.startsWith(l))||a.i-b.i);
 // One card per layer; its diagrams are slides, one shown at a time.
 const groups=LAYER.map(l=>[l,shown.filter(d=>d.page.startsWith(l))]).filter(([,ds])=>ds.length);
 $("diagram-cards").innerHTML=(window.mermaid?"":`<p class="muted" style="font-size:13px">${T("diagrams.offline")}</p>`)+groups.map(([l,ds])=>{const at=Math.min(slideAt[l]||0,ds.length-1);slideAt[l]=at;
  return `<div class="card diagram slides" data-layer="${l}"><div class="slide-head"><h3>${T("layer."+l)} <span class="muted">· ${ds.length}</span></h3>${ds.length>1?`<div class="slide-nav"><button class="plain" data-slide="-1" aria-label="${T("prev")}"${at?"":" disabled"}>←</button><span>${at+1} / ${ds.length}</span><button class="plain" data-slide="1" aria-label="${T("next")}"${at<ds.length-1?"":" disabled"}>→</button></div>`:""}</div>`+
  ds.map((d,k)=>`<div class="slide"${k===at?"":" hidden"}><p style="margin:10px 0 0;font-weight:600;font-size:15px">${esc(d.title)}${d.section?` <span class="muted" style="font-weight:400">· ${esc(d.section)}</span>`:""}</p><p class="sub" style="margin:2px 0 8px"><code>${esc(d.page)}</code></p><div id="mm${d.i}"><pre>${esc(d.code)}</pre></div></div>`).join("")+`</div>`;}).join("");

  rendering.add(d.i);mermaid.render("mmsvg"+d.i,d.code).then(r=>{svgs[d.i]=safeDiagram(r.svg,"mmsvg"+d.i);const e=$("mm"+d.i);if(e){e.replaceChildren(svgs[d.i].cloneNode(true));linkFlows(d);}})
   .catch(()=>{/* The readable source remains when parsing or sanitizing fails. */}).finally(()=>{rendering.delete(d.i);scheduleSize();});});}
// The guide shows the first system diagram, such as the context, rendered once.
let guideSvg=null,guideRendering=false;
function drawGuideSystem(){const d=DATA.diagrams.find(x=>x.page.startsWith("system/")),e=$("guide-system");
 if(!d){e.closest(".card").hidden=true;return;}
 if(guideSvg){e.replaceChildren(guideSvg.cloneNode(true));return;}
 e.innerHTML=`<p class="sub" style="margin:2px 0 8px"><code>${esc(d.page)}</code></p><pre>${esc(d.code)}</pre>`;
 if(!mermaidOn||guideRendering||!diagramSourceAllowed(d.code))return;guideRendering=true;
 mermaid.render("guidesvg",d.code).then(r=>{guideSvg=safeDiagram(r.svg,"guidesvg");e.replaceChildren(guideSvg.cloneNode(true));})
  .catch(()=>{/* The readable source remains when parsing or sanitizing fails. */}).finally(()=>{guideRendering=false;scheduleSize();});}
// In a goal's diagram, each node named after a flow shows that flow's slide in the Flows card.
function linkFlows(d){if(!d.page.startsWith("goals/"))return;const e=$("mm"+d.i);if(!e)return;
 e.querySelectorAll(".node").forEach(n=>{const f=DATA.flows.find(x=>x.title===n.textContent.trim());if(!f||!shown.some(s=>s.page===f.page))return;
  n.classList.add("to-flow");n.setAttribute("tabindex","0");n.setAttribute("role","link");n.setAttribute("aria-label",f.title);
  n.onclick=n.onkeydown=ev=>{if(ev.type==="keydown"&&ev.key!=="Enter")return;focusFlow(f.page);};});}
function focusFlow(page){const ds=shown.filter(s=>s.page.startsWith("flows/")),k=ds.findIndex(s=>s.page===page);if(k<0)return;
 slideAt["flows/"]=k;drawDiagrams(shown);const c=document.querySelector('[data-layer="flows/"]');
 c.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
 c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),1600);}
function examplePath(){
 const opsIn=x=>DATA.operations.filter(o=>new RegExp("\\b"+o.id+"\\b").test(x.when));
 let best=null;
 for(const x of scen){const rule=x.covers[0];const op=opsIn(x)[0];
  const sys=rule&&(out[rule]||[]).find(c=>c.startsWith("SYS-"));const score=(rule?1:0)+(op?1:0)+(sys?1:0);
  if(!best||score>best.score)best={x,rule,op,sys,score};}
 if(!best)return null;const {x,rule,op}=best;
 const sys=best.sys||(op&&out[op.id].find(c=>c.startsWith("SYS-")))||DATA.requirements[0]?.id;
 const goal=DATA.goals.find(g=>g.criteria.some(c=>c.proven.includes(x.id)))||DATA.goals[0];
 return [sys,goal&&`${goal.title} (${goal.key})`,`${x.flow} · ${x.id}`,[rule,op&&op.id].filter(Boolean).join(" · ")];}
const HREF=["#guide-system","#goals","#diagrams","#summary"];
function drawMap(){const svg=$("map");[...svg.querySelectorAll("g,rect,text")].forEach(e=>e.remove());
 const L=T("layers"),ex=examplePath()||[],W=1000,B=58,I=26,H=B*4+10;svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
 const nums=[DATA.requirements.length+" SYS",`${DATA.goals.length} · ${DATA.goals.flatMap(g=>g.criteria).length} criteria`,`${DATA.flows.length} · ${scen.length} scenarios${flowRules.length?` · ${flowRules.length} ${T("flowRules")}`:""}`,`${DATA.rules.length} rules · ${DATA.operations.length} operations`];
 L.forEach(([name,desc],i)=>{const x=i*I,y=i*B,g=document.createElementNS(NS,"a");g.setAttribute("href",HREF[i]);
  const r=document.createElementNS(NS,"rect");r.setAttribute("x",x+1);r.setAttribute("y",y+1);r.setAttribute("width",W-2*x-2);r.setAttribute("height",H-y-2);r.setAttribute("rx",12);r.setAttribute("fill",`var(${CV[i]})`);r.setAttribute("stroke",`var(${CI[i]})`);r.setAttribute("stroke-opacity",".35");
  const t=(tx,ty,txt,size,weight,anchor)=>{const e=document.createElementNS(NS,"text");e.setAttribute("x",tx);e.setAttribute("y",ty);e.setAttribute("text-anchor",anchor||"start");e.style.cssText=`font-family:inherit;font-size:${size}px;font-weight:${weight};fill:var(${CI[i]})`;e.textContent=txt;return e;};
  g.append(r,t(x+16,y+22,`${i+1}. ${name}`,16,600),t(x+16,y+43,`${desc} — ${nums[i]}`,13,400));
  if(ex[i])g.append(t(W-x-16,y+33,`${T("example")}: ${ex[i]}`,13,500,"end"));
  svg.appendChild(g);});}
// Layer colors of the map: 0 goals and requirements, 1 scenarios, 2 rules, 3 operations, 5 Flow rules. Column 4 is not used.
const NS="http://www.w3.org/2000/svg",CV=["--c0","--c1","--c2","--c3",,"--c1"],CI=["--c0i","--c1i","--c2i","--c3i",,"--c1i"];

$("diagram-cards").onclick=e=>{const b=e.target.closest("[data-slide]");if(!b||b.disabled)return;const l=b.closest("[data-layer]").dataset.layer;slideAt[l]=(slideAt[l]||0)+ +b.dataset.slide;drawDiagrams(shown);};

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sideNode)closeSide();});

document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("lang",lang);}catch(e){}render();});
const walk=(s,adj)=>{const seen=new Set(s),q=[...s];while(q.length)for(const n of adj[q.pop()]||[])if(!seen.has(n)){seen.add(n);q.push(n);}return seen;};
function slice(){if(!analysis)return new Set();
 const start=new Set(Object.keys(col).filter(n=>[...analysis].some(k=>n.startsWith(k+"-"))));
