openapi: 3.0.3
info:
  title: Member artifact
  version: 0.1.0
  description: >
    Contract of the member artifact. Written before the code (contract first);
    the service that serves it implements it, and the clients call it.
servers:
  - url: http://localhost:8080
    description: Local API gateway
security:
  - memberBearer: []
paths:
  /v1/me:
    get:
      operationId: getMyMember
      summary: Read the signed-in member and whether they may borrow.
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '401':
          $ref: '../../system/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../system/openapi.yaml#/components/responses/NotFound'
components:
  securitySchemes:
    memberBearer:
      $ref: '../../system/openapi.yaml#/components/securitySchemes/memberBearer'
  schemas:
    Member:
      type: object
      required: [id, name, status, loan_count, loan_limit, can_borrow]
      properties:
        id:
          type: integer
          example: 7
        name:
          type: string
          description: Not empty after trimming spaces.
          example: Sam Lee
        status:
          type: string
          enum: [active, suspended]
        loan_count:
          type: integer
          description: Books on loan or overdue to the member.
          example: 1
        loan_limit:
          type: integer
          description: The loan limit of the member's home region.
          example: 3
        can_borrow:
          type: boolean
          description: False when the member may not borrow.
    MemberResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Member'
