openapi: 3.0.3
info:
  title: Book artifact
  version: 0.1.0
  description: >
    Contract of the book artifact. Written before the code (contract first);
    the service that serves it implements it, and the clients call it.
servers:
  - url: http://localhost:8080
    description: Local API gateway
paths:
  /staff/v1/books:
    post:
      operationId: createBook
      summary: Add a book to the collection (BK-1, BK-2).
      security:
        - staffBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBook'
      responses:
        '201':
          description: The new book, available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '../../system/openapi.yaml#/components/responses/Unauthorized'
        '422':
          $ref: '../../system/openapi.yaml#/components/responses/UnprocessableEntity'
  /staff/v1/books/{id}/withdraw:
    post:
      operationId: withdrawBook
      summary: Take a book out of the collection for good (BK-7, BK-8).
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/BookID'
      responses:
        '200':
          description: The withdrawn book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '../../system/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../system/openapi.yaml#/components/responses/NotFound'
        '422':
          $ref: '../../system/openapi.yaml#/components/responses/UnprocessableEntity'
  /v1/books/{id}:
    get:
      operationId: getBook
      summary: Read one book as a member (BK-8, BK-9).
      security:
        - memberBearer: []
      parameters:
        - $ref: '#/components/parameters/BookID'
      responses:
        '200':
          description: The book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '../../system/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../system/openapi.yaml#/components/responses/NotFound'
components:
  securitySchemes:
    staffBearer:
      $ref: '../../system/openapi.yaml#/components/securitySchemes/staffBearer'
    memberBearer:
      $ref: '../../system/openapi.yaml#/components/securitySchemes/memberBearer'
  parameters:
    BookID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    CreateBook:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Not empty after trimming spaces (BK-1).
          example: A Field Guide to Birds
    Book:
      type: object
      required: [id, title, status, due_at, borrowed_by_me]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: A Field Guide to Birds
        status:
          type: string
          enum: [available, on_loan, overdue, withdrawn]
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Set while the book is on loan or overdue, null otherwise (BK-4, BK-5, SYS-3).
          example: '2030-01-15T18:00:00Z'
        borrowed_by_me:
          type: boolean
          description: True when the reader is the borrower. The response names no other borrower (BK-9).
    BookResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Book'
