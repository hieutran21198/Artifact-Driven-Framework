openapi: 3.0.3
info:
  title: Book artifact
  version: 0.1.0
  description: >
    Contract of the book artifact. Written before the code (contract first);
    the service that serves it implements it, and the clients call it.
servers:
  - url: http://localhost:8080
    description: Local API gateway
paths:
  /staff/v1/books:
    post:
      operationId: createBook
      summary: Add a book to the collection.
      security:
        - staffBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBook'
      responses:
        '201':
          description: The new book, available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '../../system/openapi.yaml#/components/responses/Unauthorized'
        '422':
          $ref: '../../system/openapi.yaml#/components/responses/UnprocessableEntity'
  /staff/v1/books/{id}/withdraw:
    post:
      operationId: withdrawBook
      summary: Take a book out of the collection for good.
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/BookID'
      responses:
        '200':
          description: The withdrawn book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '../../system/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../system/openapi.yaml#/components/responses/NotFound'
        '422':
          $ref: '../../system/openapi.yaml#/components/responses/UnprocessableEntity'
  /v1/books/{id}:
    get:
      operationId: getBook
      summary: Read one book as a member.
      security:
        - memberBearer: []
      parameters:
        - $ref: '#/components/parameters/BookID'
      responses:
        '200':
          description: The book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '../../system/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../system/openapi.yaml#/components/responses/NotFound'
  /v1/books/{id}/borrow:
    post:
      operationId: borrowBook
      summary: Lend an available book to the signed-in member.
      security:
        - memberBearer: []
      parameters:
        - $ref: '#/components/parameters/BookID'
      responses:
        '200':
          description: The book, now on loan, with its due time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '../../system/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../system/openapi.yaml#/components/responses/NotFound'
        '422':
          $ref: '../../system/openapi.yaml#/components/responses/UnprocessableEntity'
  /v1/books/{id}/return:
    post:
      operationId: returnBook
      summary: End the loan of a book the signed-in member holds.
      security:
        - memberBearer: []
      parameters:
        - $ref: '#/components/parameters/BookID'
      responses:
        '200':
          description: The book, available again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '../../system/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../system/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../system/openapi.yaml#/components/responses/NotFound'
        '422':
          $ref: '../../system/openapi.yaml#/components/responses/UnprocessableEntity'
x-triggers:
  overdueCheck:
    description: >
      Fires every day at 02:00 in the library's time zone and starts the
      overdue worker. The same trigger can arrive twice. A change keeps the
      input of triggers already scheduled.
    input:
      $ref: '#/components/schemas/OverdueCheckInput'
components:
  securitySchemes:
    staffBearer:
      $ref: '../../system/openapi.yaml#/components/securitySchemes/staffBearer'
    memberBearer:
      $ref: '../../system/openapi.yaml#/components/securitySchemes/memberBearer'
  parameters:
    BookID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    CreateBook:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Not empty after trimming spaces.
          example: A Field Guide to Birds
    Book:
      type: object
      required: [id, title, status, due_at, borrowed_by_me]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: A Field Guide to Birds
        status:
          type: string
          enum: [available, on_loan, overdue, withdrawn]
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Set while the book is on loan or overdue, null otherwise.
          example: '2030-01-15T18:00:00Z'
        borrowed_by_me:
          type: boolean
          description: True when the reader is the borrower. The response names no other borrower.
    BookResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Book'
    OverdueCheckInput:
      type: object
      required: [run_at]
      properties:
        run_at:
          type: string
          format: date-time
          description: The time the scheduler fired the trigger; a loan is overdue when its due time is before it.
          example: '2030-01-16T02:00:00Z'
